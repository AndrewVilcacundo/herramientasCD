# Inventario de Servidores para Despliegue Continuo (CD)
# Proyecto: Demostración Ansible CD - Integración de Sistemas
# Alumno: Andrew Vilcacundo

[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/local/bin/python

[webservers]
# En un entorno de producción, aquí se definen las IPs o dominios de los servidores gestionados:
# prod-web-01 ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
# prod-web-02 ansible_host=192.168.1.51 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Para la demostración local autocontenida:
localhost ansible_connection=local ansible_python_interpreter=/usr/local/bin/python

[all:vars]
app_name=demo-webapp-ansible
app_port=8080
container_port=80
app_version=v1.0.0
app_env=production
maintainer="Andrew Vilcacundo & Galindo"
subject="Integracion de Sistemas - 10% P1"
webapp_volume_name="ansible_webapp_vol"
container_web_root="/ansible/www"
